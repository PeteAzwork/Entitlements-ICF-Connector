# ICF framework flavour used for compilation and unit tests.
#   connid    - net.tirasa.connid:connector-framework (Maven Central). Same org.identityconnectors API
#               surface; works without access to maven.forgerock.org. Default so the suite runs anywhere.
#   forgerock - org.forgerock.openicf.framework:connector-framework (maven.forgerock.org). Use this
#               for the release build and in CI runners that can reach the ForgeRock repository.
icfFlavour=connid
forgerockIcfVersion=1.5.20.21
connidIcfVersion=1.5.2.0
groovyVersion=3.0.21
spockVersion=2.3-groovy-3.0
wiremockVersion=3.9.1
httpBuilderVersion=0.7.1
httpClientVersion=4.5.14
org.gradle.jvmargs=-Xmx1g
