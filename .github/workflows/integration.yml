name: integration

# WS8.12: the connector inside a real IDM 7.5 container (gcr.io/forgerock-io/idm:7.5.0), nightly and on demand.
# Failures notify through GitHub's standard workflow-failure notifications.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scale:
        description: 'Users (and accounts) for the volume and concurrency spec; 0 skips it'
        default: '0'

jobs:
  idm:
    name: Integration (IDM 7.5)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pull the IDM image
        run: docker pull gcr.io/forgerock-io/idm:7.5.0
      - name: Integration tests
        run: ./gradlew --no-daemon :integration:test -Pidm -PidmScale=${{ github.event.inputs.scale || '0' }}
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: |
            integration/build/reports/tests/test
            integration/build/test-results/test
            integration/build/scale-report.txt
