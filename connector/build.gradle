description = 'Groovy Scripted REST connector scripts and supporting library for the Graph Entity Service'

// Test fixtures (FakeGraphService, FakeGraphHttpServer) are shared with other subprojects' tests,
// e.g. the contract probe, via testImplementation(testFixtures(project(':connector'))).
apply plugin: 'java-test-fixtures'

dependencies {
    // The Scripted REST connector binds `connection` as a groovyx.net.http.RESTClient (HTTP Builder).
    implementation("org.codehaus.groovy.modules.http-builder:http-builder:${httpBuilderVersion}") {
        exclude group: 'org.codehaus.groovy', module: 'groovy'
        // json-lib is published only with a JDK classifier, which the http-builder POM does not name,
        // so it is excluded here and re-declared explicitly below. RESTClient's JSON parser needs it.
        exclude group: 'net.sf.json-lib'
    }
    implementation('net.sf.json-lib:json-lib:2.4:jdk15') {
        exclude group: 'org.codehaus.groovy'
    }
    implementation "org.apache.httpcomponents:httpclient:${httpClientVersion}"

    // WS5.07: the mapping library (../mapping-lib) is evaluated under Rhino, as IDM runs it.
    testImplementation "org.mozilla:rhino:${rhinoVersion}"

    testFixturesImplementation "org.codehaus.groovy:groovy:${groovyVersion}"
    testFixturesImplementation "org.codehaus.groovy:groovy-json:${groovyVersion}"
}

sourceSets {
    main {
        groovy {
            // The ICF operation scripts live beside the library so they are compiled (syntax-checked)
            // in the same pass, but they are packaged separately into the connector bundle.
            srcDirs += 'src/main/scripts'
        }
    }
}

// IDM 7.5 ships Groovy 3.0.9 and, when the library is deployed as scripts, compiles it with that version (see
// script_vs_jar.md). The build compiles with groovyVersion; this task compiles the library and the scripts again
// with IDM's own Groovy, so a construct 3.0.9 cannot compile fails the build rather than the connector in IDM.
configurations {
    idmGroovyCompile {
        extendsFrom configurations.implementation, configurations.compileOnly
        canBeConsumed = false
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.codehaus.groovy') details.useVersion(idmGroovyVersion)
        }
    }
}
tasks.register('compileWithIdmGroovy', GroovyCompile) {
    group = 'verification'
    description = "Compiles the library and scripts with IDM 7.5's Groovy (${idmGroovyVersion})"
    source = sourceSets.main.groovy
    classpath = configurations.idmGroovyCompile
    groovyClasspath = configurations.idmGroovyCompile
    destinationDirectory = layout.buildDirectory.dir('classes/idm-groovy')
    sourceCompatibility = '17'
    targetCompatibility = '17'
    // Groovy 3.0.9 cannot read newer class files, and IDM 7.5 runs on JDK 17: compile on a JDK 17, as IDM does.
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
check.dependsOn 'compileWithIdmGroovy'

// The connector library as a jar, without the operation scripts: the alternative to deploying it as Groovy sources
// (script_vs_jar.md). Both work in IDM 7.5; scripts are the default.
tasks.register('libraryJar', Jar) {
    group = 'distribution'
    description = 'Packages the compiled connector library, without the scripts, for the provisioner classpath'
    archiveBaseName = 'graphentity-connector-lib'
    from(sourceSets.main.output) {
        exclude '*Script.class', '*Script$*.class'   // the scripts compile to the default package; the harness loads them from scriptRoots
    }
}

// Assemble what is copied into <idm>/connectors/graphentity. By default the library goes in as Groovy sources under
// lib/, which the provisioner's classpath names (script_vs_jar.md); -PlibraryAs=jar puts lib/graphentity-connector-lib.jar
// there instead, and the classpath must then name the jar file.
def libraryAsJar = project.findProperty('libraryAs') == 'jar'
tasks.register('connectorScripts', Sync) {   // Sync, not Copy: nothing stale is left behind
    group = 'distribution'
    description = 'Copies the ICF operation scripts, the library (sources, or -PlibraryAs=jar) and the provisioner sample into build/connector-scripts'
    from('src/main/scripts') { into 'scripts' }
    if (libraryAsJar) {
        from(tasks.named('libraryJar')) {
            into 'lib'
            rename { 'graphentity-connector-lib.jar' }
        }
    } else {
        from('src/main/groovy') { into 'lib' }
    }
    from('../config') { include 'provisioner.openicf-graphentity.json' }
    into layout.buildDirectory.dir('connector-scripts')
}
