description = 'Groovy Scripted REST connector scripts and supporting library for the Graph Entity Service'

dependencies {
    // The Scripted REST connector binds `connection` as a groovyx.net.http.RESTClient (HTTP Builder).
    implementation("org.codehaus.groovy.modules.http-builder:http-builder:${httpBuilderVersion}") {
        exclude group: 'org.codehaus.groovy', module: 'groovy'
        exclude group: 'net.sf.json-lib'
        exclude group: 'xml-resolver'
        exclude group: 'net.sourceforge.nekohtml'
    }
    implementation "org.apache.httpcomponents:httpclient:${httpClientVersion}"
}

sourceSets {
    main {
        groovy {
            // The ICF operation scripts live beside the library so they are compiled (syntax-checked)
            // in the same pass, but they are packaged separately into the connector bundle.
            srcDirs += 'src/main/scripts'
        }
    }
}

// Assemble the artefact that is copied into IDM's connector script directory.
tasks.register('connectorScripts', Copy) {
    group = 'distribution'
    description = 'Copies the ICF operation scripts and provisioner sample into build/connector-scripts'
    from('src/main/scripts') { into 'scripts' }
    from('src/main/groovy') { into 'lib' }
    from('../config') { include 'provisioner.openicf-graphentity.json' }
    into layout.buildDirectory.dir('connector-scripts')
}
