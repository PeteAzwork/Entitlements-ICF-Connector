// Root build for the Ping IDM Scripted REST connector for the Entitlements Accelerator Service.
// See docs/delivery-plan.md for the delivery plan and README.md for how to run the suite.

subprojects {
    apply plugin: 'groovy'

    group = 'idm.entitlementsaccelerator'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
        if (rootProject.findProperty('icfFlavour') == 'forgerock') {
            maven {
                url = uri('https://maven.forgerock.org/repo/releases')
                // WS7.05: the ForgeRock repository needs an account; CI passes it from secrets, never from files.
                if (System.getenv('FORGEROCK_MAVEN_USERNAME')) {
                    credentials {
                        username = System.getenv('FORGEROCK_MAVEN_USERNAME')
                        password = System.getenv('FORGEROCK_MAVEN_PASSWORD')
                    }
                }
            }
        }
    }

    // Built and tested on JDK 21 wherever the build runs: Gradle uses an installed JDK 21, or downloads one
    // (settings.gradle), so the result doesn't depend on the machine's default Java.
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }
    // The class files stay at Java 17: IDM 7.5 runs on JDK 17 and must load the library jar, and the discovery
    // and load-test tools then run on Java 17 or later.
    tasks.withType(JavaCompile).configureEach { options.release = 17 }
    tasks.withType(GroovyCompile).configureEach {
        sourceCompatibility = '17'
        targetCompatibility = '17'
    }

    dependencies {
        implementation "org.codehaus.groovy:groovy:${groovyVersion}"
        implementation "org.codehaus.groovy:groovy-json:${groovyVersion}"
        // HTTP Builder's ParserRegistry loads XmlSlurper types; IDM ships the full Groovy runtime, so this matches production.
        implementation "org.codehaus.groovy:groovy-xml:${groovyVersion}"

        // ICF framework: the API the connector scripts are written against.
        if (rootProject.findProperty('icfFlavour') == 'forgerock') {
            implementation "org.forgerock.openicf.framework:connector-framework:${forgerockIcfVersion}"
            testImplementation "org.forgerock.openicf.framework:connector-framework-internal:${forgerockIcfVersion}"
        } else {
            implementation "net.tirasa.connid:connector-framework:${connidIcfVersion}"
            testImplementation "net.tirasa.connid:connector-framework-internal:${connidIcfVersion}"
        }

        testImplementation platform("org.spockframework:spock-bom:${spockVersion}")
        testImplementation 'org.spockframework:spock-core'
        testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
        testRuntimeOnly 'net.bytebuddy:byte-buddy:1.14.18'
        testRuntimeOnly 'org.objenesis:objenesis:3.3'
    }

    test {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat = 'short'
            showStandardStreams = false
        }
        // Keep running every spec even when stubs make most of them fail.
        ignoreFailures = false
        reports.html.required = true
        reports.junitXml.required = true
    }
}
