description = 'WS0 contract probe: observes the Entitlements Accelerator Service API and records the evidence for docs/service-contract.md'

apply plugin: 'application'

application {
    mainClass = 'idm.entitlementsaccelerator.probe.ProbeMain'
}

dependencies {
    testImplementation testFixtures(project(':connector'))
}

// The probe is run by people against a test instance, never by CI against anything real.
// Example: ACCELERATOR_PROBE_API_KEY=... ./gradlew :contract-probe:run --args="--base-url https://accelerator.test.example"
tasks.named('run') {
    workingDir = rootProject.projectDir
}
